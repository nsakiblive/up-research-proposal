name: Publish research proposal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: research-proposal-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.url }}
    steps:
      - name: Read Pages configuration
        id: site
        uses: actions/github-script@v7
        with:
          script: |
            const { data: page } = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
            core.setOutput('mode', page.build_type);
            core.setOutput('url', page.html_url);
            await core.summary.addHeading('Research proposal publication')
              .addTable([
                [{data:'Setting',header:true},{data:'Value',header:true}],
                ['Build type', String(page.build_type)],
                ['Branch', String(page.source?.branch || '')],
                ['Folder', String(page.source?.path || '')],
                ['URL', String(page.html_url)]
              ]).write();
      - name: Request branch-based Pages build
        if: steps.site.outputs.mode != 'workflow'
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/pages/builds', context.repo);
            await core.summary.addRaw('GitHub Pages build requested successfully.').write();
      - name: Check out website
        if: steps.site.outputs.mode == 'workflow'
        uses: actions/checkout@v4
      - name: Configure Pages
        if: steps.site.outputs.mode == 'workflow'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: steps.site.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        if: steps.site.outputs.mode == 'workflow'
        uses: actions/deploy-pages@v4
